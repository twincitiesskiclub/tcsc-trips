{% extends 'admin/admin_base.html' %}
{% block title %}Analytics{% endblock %}
{% block content %}
<div class="space-y-6">
  <h1 class="text-2xl font-semibold text-tcsc-navy">Analytics</h1>
  <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
    {% for dashboard in dashboards %}
    <a href="{{ url_for('admin_analytics.dashboard', slug=dashboard.slug) }}" class="block min-w-0 rounded-lg border border-solid border-zinc-200 bg-white p-4 text-tcsc-navy no-underline hover:bg-zinc-50">
      <h2 class="text-lg font-semibold break-words">{{ dashboard.title }}</h2>
      <p class="text-sm text-zinc-600 break-words">{{ dashboard.question }}</p>
    </a>
    {% else %}
    <p class="text-sm text-zinc-600">Dashboards will appear here when they are available.</p>
    {% endfor %}
  </div>
</div>
{% endblock %}
