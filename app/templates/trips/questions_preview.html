<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preview survey | Twin Cities Ski Club</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind-output.css') }}">
  <script src="{{ url_for('static', filename='trip_questions_preview.js') }}" type="module"></script>
</head>
<body class="trip-page min-h-screen bg-tcsc-gray-50 font-sans leading-relaxed text-tcsc-navy antialiased">
<main class="mx-auto max-w-3xl px-4 py-6 sm:px-6 sm:py-8">
  <div class="trip-notice mb-6 flex items-start gap-3" role="status">
    <svg class="mt-0.5 h-5 w-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7v1" stroke-linecap="round"/></svg>
    <p class="text-sm">Preview only. Nothing is saved or submitted.</p>
  </div>
  {% if error %}
  <p class="rounded-xl border border-red-200 bg-red-50 p-5 text-red-700" role="alert">{{ error }}</p>
  {% else %}
  <div id="trip-survey-preview" class="space-y-6">
    {% set steps = namespace(n=0) %}
{% include 'trips/_profile_sections.html' %}
{% include 'trips/_custom_questions.html' %}
    <p id="survey-errors" class="text-sm text-red-700" role="alert"></p>
  </div>
  {% endif %}
</main>
</body>
</html>
