headline: Our sponsors
intro: >-
  Our sponsors pay for the wax, vans, and race-day gear that every member
  shares, racer or not, and keep dues within reach.
impact_heading: What sponsor money paid for
impact_intro: Everything here is shared by racers and non-racers alike.
impact_items:
  - title: Team wax sessions
    detail: Two wax drills and a shared wax supply, open to every member.
  - title: Vans to races
    detail: >-
      Rental vans carried food, gear, and supplies to the Prebirkie and the
      Great Bear Chase, so volunteer trip leaders had less to haul.
  - title: A base at the Birkie
    detail: >-
      A team tent and start-area parking: a place to wax, warm up, test skis,
      and cheer.
recognition_heading: Sponsor logos at the races
recognition_body: >-
  Six club jackets carry sponsor logos at races and in podium photos.
recognition_caption: A sponsor-logo team jacket at the Great Bear Chase.
priorities_heading: What comes next
priorities_intro: Where the next sponsor dollars go.
priority_items:
  - title: PFAS-free wax
    detail: >-
      Replace the club's shared wax with PFAS-free products.
  - title: More coaches, more gym space
    detail: Add coaches and book larger training spaces as the club grows.
  - title: Shared gear
    detail: Equipment that lowers the cost of a first season.
contact_heading: Sponsor TCSC
contact_body: Email club leadership about sponsorship and what the club needs this season.
contact_email: contact@twincitiesskiclub.org
contact_cta_label: Email club leadership
disclosure: >-
  Sponsor recognition is thanks, not an endorsement of a sponsor's products or
  services.
