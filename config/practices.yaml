# Practice Management Configuration
# Default settings for practice sessions

practices:
  default_duration_minutes: 90
  reminder_hours_before: 24
  workout_due_hours_before: 48

  # Default location if none specified
  default_location: "Theodore Wirth"

slack:
  # Channel for practice announcements
  announcement_channel: "#announcements-practices"

  # Channel for lead/coach coordination
  team_channel: "#practices-team"

  # Whether to post workout details in announcement
  include_workout_in_announcement: true

rsvp:
  enabled: true
  # Close RSVPs this many hours before practice
  close_hours_before: 2

lead_availability:
  # Custom workspace emoji, one per session, in order. These were renamed once
  # already (regional_indicator_* -> letter_*) and that silently broke a live
  # poll, so they live here rather than in code.
  letter_emoji:
    - letter_a
    - letter_b
    - letter_c
    - letter_d
    - letter_e
    - letter_f
    - letter_g
    - letter_h
    - letter_i
    - letter_j
    - letter_k
    - letter_l
    - letter_m
    - letter_n
    - letter_o
    - letter_p
    - letter_q
    - letter_r
    - letter_s
    - letter_t
    - letter_u
    - letter_v
    - letter_w
    - letter_x
    - letter_y
    - letter_z
  # Native emoji meaning "that's everything from me", including picking nothing.
  done_emoji: white_check_mark
